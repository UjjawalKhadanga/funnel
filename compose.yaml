services:
  redis:
    image: redis/redis-stack-server@sha256:798ab84d9f266936b034ab11c4d04a2b8e4b441884c5aa7d17ac951eefdf742a
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    environment:
      REDIS_ARGS: '--appendonly yes'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  redis-data:
